<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forge models</title>
<style>
  :root { --bg: #15161a; --card: #1f2026; --line: #2e3038; --text: #e9e9ee; --dim: #9a9cab; --ok: #5cc98b; --bad: #e0736a; --accent: #f2b45c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 17px; margin: 0 0 8px; font-weight: 600; }
  h1 small { color: var(--dim); font-weight: 400; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 160px; min-width: 0; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  button, .tabs label { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 11px; font: inherit; cursor: pointer; }
  .tabs input { display: none; }
  .tabs input:checked + span { color: var(--accent); }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 12px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card .pic { aspect-ratio: 1; background: #26272e; display: grid; place-items: center; color: var(--dim); font-size: 12px; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .t { padding: 6px 8px 8px; font-size: 13px; }
  .card .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .m { color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--dim); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  #view { position: fixed; inset: 0; z-index: 5; background: #2a2b31; display: none; }
  #view.open { display: block; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 6px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; align-items: center; background: linear-gradient(#000a, #0000); }
  .top .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top button { padding: 6px 10px; background: #1f2026cc; }
  .top button.on { color: var(--accent); }
  #info { position: absolute; left: 0; right: 0; bottom: 0; max-height: 46%; overflow: auto; background: #15161ae8; border-top: 1px solid var(--line);
          padding: 12px 16px max(14px, env(safe-area-inset-bottom)); font-size: 14px; }
  #info.hide { display: none; }
  #info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 8px 0; }
  #info dt { color: var(--dim); } #info dd { margin: 0; }
  #info .pics { display: flex; gap: 6px; overflow-x: auto; padding-top: 6px; }
  #info .pics img { height: 90px; border-radius: 6px; cursor: zoom-in; }
  #big { position: fixed; inset: 0; z-index: 9; background: #000e; display: none; place-items: center; }
  #big.open { display: grid; } #big img { max-width: 100%; max-height: 100%; }
  .empty { color: var(--dim); padding: 30px 16px; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<header>
  <h1>Forge models <small id="count"></small></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Search names and briefs">
    <div class="tabs" id="tabs">
      <label><input type="radio" name="g" value="props" checked><span>Props</span></label>
      <label><input type="radio" name="g" value="library"><span>Every round</span></label>
      <label><input type="radio" name="g" value="dense"><span>Dense</span></label>
      <label><input type="radio" name="g" value="tests"><span>Tests</span></label>
    </div>
  </div>
</header>
<main id="grid"></main>
<div id="view">
  <canvas id="c"></canvas>
  <div class="top">
    <button id="close" aria-label="Close">✕</button>
    <div class="title" id="vt"></div>
    <button id="prev" aria-label="Previous">‹</button>
    <button id="next" aria-label="Next">›</button>
    <button id="spin" class="on">Spin</button>
    <button id="wire">Wire</button>
    <button id="inf" class="on">Info</button>
  </div>
  <div id="info"></div>
</div>
<div id="big"><img alt=""></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kb = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.round(n / 1e3) + ' kB';
const loader = new GLTFLoader();
const url = (f) => '/files/' + f.split('/').map(encodeURIComponent).join('/');

let all = [], shown = [], current = -1;
const byName = {};

function stage(renderer) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2b31);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444450, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(2, 4, 3); scene.add(sun);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshStandardMaterial({ color: 0x34353c, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.002; scene.add(floor);
  return scene;
}

// the forge's models stand on the origin, largest side 1; frame whatever comes anyway
function frame(obj, camera, controls) {
  const box = new THREE.Box3().setFromObject(obj), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  const s = 1 / Math.max(size.x, size.y, size.z, 1e-6); obj.scale.setScalar(s); obj.position.multiplyScalar(s);
  const h = size.y * s, r = 0.5 * Math.hypot(size.x, size.y, size.z) * s;
  // fit the narrower of the two fields of view: a phone held upright is narrow across
  const half = Math.min(THREE.MathUtils.degToRad(camera.fov / 2), Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect));
  const d = r / Math.sin(half) * 1.05;
  camera.position.set(d * 0.55, h * 0.5 + d * 0.3, d * 0.8);
  const target = new THREE.Vector3(0, h * 0.45, 0);
  camera.lookAt(target); camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix();
  if (controls) { controls.target.copy(target); controls.update(); }
}

function dispose(obj) {
  obj.traverse((o) => {
    o.geometry?.dispose();
    for (const m of [o.material].flat().filter(Boolean)) { for (const v of Object.values(m)) v?.isTexture && v.dispose(); m.dispose(); }
  });
}

// ---- thumbnails: one small renderer, one model at a time; the picture is kept on the server ----
const thumbR = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
thumbR.setSize(320, 320, false); thumbR.outputColorSpace = THREE.SRGBColorSpace;
const thumbScene = stage(thumbR), thumbCam = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
const queue = []; let busy = false;
async function pump() {
  if (busy || !queue.length) return;
  busy = true;
  const { item, img } = queue.shift();
  try {
    const gltf = await loader.loadAsync(url(item.file));
    thumbScene.add(gltf.scene); frame(gltf.scene, thumbCam); thumbR.render(thumbScene, thumbCam);
    const blob = await new Promise((ok) => thumbR.domElement.toBlob(ok, 'image/webp', 0.85));
    thumbScene.remove(gltf.scene); dispose(gltf.scene);
    img.src = URL.createObjectURL(blob); item.has_thumb = true;
    fetch('/thumbs/' + encodeURIComponent(item.thumb), { method: 'POST', body: blob }).catch(() => {});
  } catch (e) { img.replaceWith(Object.assign(document.createElement('span'), { textContent: 'could not load' })); }
  busy = false; pump();
}
const seen = new IntersectionObserver((es) => {
  for (const e of es) if (e.isIntersecting) {
    seen.unobserve(e.target);
    const img = e.target, item = shown[+img.dataset.i];
    const draw = () => { img.onerror = null; queue.push({ item, img }); pump(); };
    if (!item.has_thumb) { draw(); continue; }
    img.onerror = draw;
    img.src = '/thumbs/' + encodeURIComponent(item.thumb);
  }
}, { rootMargin: '300px' });

function kind() { return document.querySelector('#tabs input:checked').value; }
function list() {
  const g = kind(), q = $('#q').value.trim().toLowerCase();
  shown = all.filter((i) => g === 'dense' ? i.dense : g === 'library' ? i.group === 'library' && !i.dense : i.group === g)
    .filter((i) => !q || (i.name + ' ' + (i.brief || '')).toLowerCase().includes(q));
  $('#count').textContent = `${shown.length} of ${all.length}`;
  const grid = $('#grid'); grid.innerHTML = '';
  if (!shown.length) grid.innerHTML = '<div class="empty">Nothing here.</div>';
  shown.forEach((i, n) => {
    const passed = i.passed === true ? 'ok' : i.passed === false ? 'bad' : '';
    const tag = i.group === 'library' ? `r${i.round} s${i.seed}${i.score != null ? ' · ' + i.score + '/10' : ''}${i.final ? ' · final' : ''}` : kb(i.bytes);
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = `<div class="pic"><img data-i="${n}" alt=""></div><div class="t"><div class="n">${esc(i.name)}</div>` +
      `<div class="m"><span class="dot ${passed}"></span>${esc(tag)}</div></div>`;
    el.onclick = () => open(n);
    grid.append(el); seen.observe(el.querySelector('img'));
  });
}

// ---- the big view ----
const canvas = $('#c'), R = new THREE.WebGLRenderer({ canvas, antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.outputColorSpace = THREE.SRGBColorSpace;
const scene = stage(R), camera = new THREE.PerspectiveCamera(32, 1, 0.01, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 1.6;
let model = null, wire = false, token = 0;

function info(i) {
  const prop = byName[i.name] || {};
  const rows = [['Brief', i.brief || prop.brief], ['Subject', i.subject], ['Style', i.style],
    ['Judge', i.score != null ? `${i.score}/10${i.passed ? ', passed' : ', not passed'}` : i.passed != null ? (i.passed ? 'passed' : 'not passed') : ''],
    ['Problems', (i.problems || []).join('; ')], ['Gates', (i.gate_fails || []).join('; ')],
    ['Front match', i.front_iou], ['Triangles', i.tris], ['Size', kb(i.bytes)], ['File', i.file]].filter((r) => r[1] !== undefined && r[1] !== null && r[1] !== '');
  const pics = [prop.review, ...(prop.progress || [])].filter(Boolean);
  $('#info').innerHTML = `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` +
    (pics.length ? `<div class="pics">${pics.map((p) => `<img src="${url(p)}" alt="">`).join('')}</div>` : '');
  $('#info').querySelectorAll('.pics img').forEach((im) => im.onclick = () => { $('#big img').src = im.src; $('#big').classList.add('open'); });
}

async function open(n) {
  current = (n + shown.length) % shown.length;
  const i = shown[current], mine = ++token;
  $('#view').classList.add('open'); $('#vt').textContent = i.name + (i.group === 'library' ? ` · r${i.round} s${i.seed}` : '');
  info(i); resize();
  if (model) { scene.remove(model); dispose(model); model = null; }
  const gltf = await loader.loadAsync(url(i.file));
  if (mine !== token) return dispose(gltf.scene);
  model = gltf.scene; scene.add(model); frame(model, camera, controls); setWire();
  if (location.hash !== '#' + i.file) history.replaceState(null, '', '#' + i.file);
}
function close() { $('#view').classList.remove('open'); token++; history.replaceState(null, '', location.pathname); }
function setWire() { model?.traverse((o) => { if (o.isMesh) for (const m of [o.material].flat()) m.wireframe = wire; }); }
function resize() {
  const w = innerWidth, h = innerHeight; R.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
R.setAnimationLoop(() => { if ($('#view').classList.contains('open')) { controls.update(); R.render(scene, camera); } });

if (innerWidth < 700) { $('#info').classList.add('hide'); $('#inf').classList.remove('on'); }  // a phone: the model first
$('#close').onclick = close;
$('#prev').onclick = () => open(current - 1);
$('#next').onclick = () => open(current + 1);
$('#spin').onclick = (e) => { controls.autoRotate = !controls.autoRotate; e.target.classList.toggle('on', controls.autoRotate); };
$('#wire').onclick = (e) => { wire = !wire; e.target.classList.toggle('on', wire); setWire(); };
$('#inf').onclick = (e) => { e.target.classList.toggle('on', $('#info').classList.toggle('hide') === false); };
$('#big').onclick = () => $('#big').classList.remove('open');
addEventListener('keydown', (e) => {
  if (!$('#view').classList.contains('open')) return;
  if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') open(current - 1); if (e.key === 'ArrowRight') open(current + 1);
});
// swipe left or right with two fingers would fight the orbit; one quick flick along the bottom panel changes model
let sx = null;
$('#info').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
$('#info').addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 60) open(current + (dx < 0 ? 1 : -1));
});

$('#q').oninput = list;
document.querySelectorAll('#tabs input').forEach((r) => r.onchange = list);
all = await (await fetch('/api/models')).json();
for (const i of all) if (i.group === 'props') byName[i.name] = i;
list();
// a link to one model: /#props/<name>/<name>.glb
function fromHash() {
  const f = decodeURIComponent(location.hash.slice(1)), it = all.find((i) => i.file === f);
  if (!it || shown[current] === it && $('#view').classList.contains('open')) return;
  const g = it.dense ? 'dense' : it.group; document.querySelector(`#tabs input[value=${g}]`).checked = true; $('#q').value = '';
  list(); open(shown.indexOf(it));
}
addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
